<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="4"/>

  <!-- Radial Glow Behind Bolt -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" opacity="0.25" filter="url(#glow)"/>

  <!-- Lightning Bolt -->
  <path d="M 284 56 
           L 148 268 
           L 248 268 
           L 204 456 
           L 372 228 
           L 268 228 
           Z" 
        fill="url(#boltGrad)" 
        filter="url(#shadow)"
        stroke="rgba(255,255,255,0.6)"
        stroke-width="3"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Inner Spark Accent -->
  <path d="M 276 96 L 180 252 L 256 252 L 230 380 L 336 244 L 264 244 Z" 
        fill="rgba(255,255,255,0.25)"/>
</svg>
