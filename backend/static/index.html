<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Motivate</title>

<!-- PWA & Apple Meta Tags -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Motivate">
<meta name="application-name" content="Motivate">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at 20% 20%,#1e1b4b,#0f172a 60%);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#e2e8f0;
  overflow:hidden;
}
.phone{
  width:390px;
  max-width:100vw;
  height:760px;
  max-height:92vh;
  background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 100%);
  border-radius:40px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  position:relative;
  display:flex;
  flex-direction:column;
}
@media (max-width: 480px), (display-mode: standalone){
  body{background:#0f172a}
  .phone{
    width:100vw;
    height:100vh;
    height:100dvh;
    max-height:100dvh;
    border-radius:0;
    box-shadow:none;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
}
.screen{
  flex:1;
  padding:24px;
  display:none;
  flex-direction:column;
  animation:fade .45s ease;
  overflow:hidden;
  height:100%;
}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.top{flex-shrink:0}
.mid{
  flex:1;
  overflow-y:auto;
  scrollbar-width:none;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.mid::-webkit-scrollbar{display:none}
.bottom{flex-shrink:0}
h1{font-size:24px;font-weight:700;margin-bottom:16px}
input{width:100%;background:#1e293b;border:1px solid #334155;color:#fff;padding:14px;border-radius:12px;font-size:16px;margin-bottom:20px}
.card{width:100%;padding:16px;background:#1e293b;border-radius:12px;margin:6px 0;cursor:pointer;transition:all .2s}
.card.active{background:#334155;border:1px solid #818cf8}
.btn{margin-top:20px;background:linear-gradient(135deg,#818cf8,#6366f1);padding:16px;border-radius:12px;width:100%;text-align:center;font-weight:600;cursor:pointer;border:none;color:#fff;font-size:16px;box-shadow:0 8px 20px rgba(99,102,241,.4)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.greet{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.gear{font-size:24px;cursor:pointer;margin-left:8px;user-select:none}
.badge{
  background:#334155;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  margin-left:8px;
  white-space:nowrap;
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
}
.rowtop{display:flex;align-items:center;gap:4px;flex-shrink:0}
.question{font-size:24px;font-weight:700;margin:20px 0;text-align:center}
.bigbtn{padding:26px;border-radius:18px;margin:10px 0;text-align:center;font-weight:700;font-size:18px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.bigbtn:hover{transform:scale(1.03)}
.bigbtn.charged{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1f2937;box-shadow:0 10px 30px rgba(245,158,11,.4)}
.bigbtn.drained{background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff;box-shadow:0 10px 30px rgba(99,102,241,.4)}
.emojiBox{display:inline-block;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:10px;margin-right:8px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.chip{background:#1e293b;padding:16px 22px;border-radius:22px;cursor:pointer;font-size:16px;transition:all .2s}
.chip:hover{background:#334155;transform:scale(1.05)}
.skip{margin-top:20px;text-align:center;color:#94a3b8;cursor:pointer}
.back{margin-top:12px;text-align:center;color:#94a3b8;cursor:pointer}
.resultcard{background:linear-gradient(135deg,#1e293b,#312e81);padding:24px;border-radius:20px;margin-top:12px;opacity:0;animation:appear 1s forwards;box-shadow:0 12px 30px rgba(0,0,0,.4);position:relative}
@keyframes appear{to{opacity:1}}
.ctx{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ctxbadge{background:#334155;padding:6px 12px;border-radius:16px;font-size:12px}
.resulttext{font-size:18px;line-height:1.7;font-weight:500}
.quote{font-size:48px;color:#818cf8;opacity:.4;line-height:1;display:inline-block}
.copybtn{position:absolute;top:12px;right:16px;font-size:20px;cursor:pointer;opacity:.7}
.copybtn:hover{opacity:1}
.pulse{animation:pulse 1.2s ease-in-out infinite;color:#94a3b8}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.micro{
  margin-top:16px;
  background:#0f172a;
  border:1px solid #334155;
  color:#ffffff;
  padding:14px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:all .25s ease;
  user-select:none;
}
.micro.done{
  background:rgba(6,78,59,.45);
  border-color:#10b981;
  opacity:.85;
}
.micro.hidden{display:none}
#microcb{
  width:18px;
  height:18px;
  accent-color:#10b981;
  cursor:pointer;
  pointer-events:auto;
}
#microtext{
  flex:1;
  font-size:14px;
  line-height:1.5;
  color:#ffffff;
}
.micro.done #microtext{
  color:#6ee7b7;
  text-decoration:line-through;
}
.empty-saved{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:36px 20px;
  background:rgba(30,41,59,.4);
  border:1px dashed #334155;
  border-radius:20px;
  margin-top:20px;
}
.empty-saved-icon{
  font-size:44px;
  margin-bottom:14px;
  filter:drop-shadow(0 4px 10px rgba(236,72,153,.2));
  animation:floatHeart 2.5s ease-in-out infinite;
}
@keyframes floatHeart{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-6px) scale(1.05)}
}
.empty-saved-title{
  font-size:15px;
  font-weight:700;
  color:#f1f5f9;
  margin-bottom:8px;
}
.empty-saved-text{
  font-size:13px;
  line-height:1.6;
  color:#94a3b8;
  max-width:270px;
}
.row{display:flex;justify-content:space-around;margin-top:24px;gap:8px}
.action{
  background:#334155;
  color:#ffffff !important;
  border:none;
  font-family:inherit;
  padding:14px 10px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
  flex:1;
  text-align:center;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.action:hover{background:#475569}
.action.fav{background:#ec4899;color:#ffffff !important}
.action:disabled{opacity:.6;cursor:not-allowed}
#favbtn{color:#ffffff !important}
.recent{margin-top:16px;text-align:center}
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.dot{width:14px;height:14px;border-radius:50%}
.dot.charged{background:#fbbf24}
.dot.drained{background:#818cf8}
.savedlist{flex:1;overflow-y:auto;scrollbar-width:none;margin-top:12px}
.savedlist::-webkit-scrollbar{display:none}
.saveditem{background:#1e293b;padding:12px;border-radius:10px;margin:6px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.del{color:#f87171;cursor:pointer;margin-left:10px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="phone">
  <div id="onboard" class="screen active">
    <div class="top"><h1>Как тебя зовут?</h1><input id="name" placeholder="Имя" /><h1>Тон мотивации</h1><div id="tones"></div></div>
    <div class="bottom"><button class="btn" onclick="saveOnboard()">Сохранить и начать</button></div>
  </div>
  <div id="main" class="screen">
    <div class="top">
      <div class="header">
        <span class="greet" id="greet"></span>
        <div class="rowtop">
          <span class="badge" id="streakbadge">🔥 1 дн.</span>
          <span class="gear" onclick="openSaved()" title="Избранное">❤️</span>
          <span class="gear" onclick="openSettings()" title="Настройки">⚙️</span>
        </div>
      </div>
    </div>
    <div class="mid">
      <div class="question">Какой сегодня заряд?</div>
      <div class="bigbtn charged" onclick="goTags('charged')"><span class="emojiBox">⚡</span> Заряжен на 100%</div>
      <div class="bigbtn drained" onclick="goTags('drained')"><span class="emojiBox">🪫</span> Батарейка на нуле</div>
    </div>
    <div class="bottom">
      <div class="recent">
        <div style="color:#94a3b8;font-size:13px">Недавний ритм</div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </div>
  <div id="tags" class="screen">
    <div class="top"><div class="question">Что повлияло?</div><div class="chips" id="chips"></div></div>
    <div class="bottom"><div class="skip" onclick="ask(null)">Пропустить</div><div class="back" onclick="go('main')">← Назад</div></div>
  </div>
  <div id="result" class="screen">
    <div class="top"><div class="ctx" id="ctx"></div></div>
    <div class="mid">
      <div class="resultcard"><span class="copybtn" onclick="copyText()">📋</span><div class="quote">“</div><div class="resulttext" id="resulttext"></div></div>
      <div class="micro hidden" id="micro" onclick="toggleMicro(event)"><input type="checkbox" id="microcb"> <span id="microtext"></span></div>
    </div>
    <div class="bottom row">
      <button class="action" id="favbtn" onclick="fav()">❤️ В избранное</button>
      <button class="action" id="retrybtn" onclick="retry()"><span id="retryicon">🔄</span> <span id="retrylabel">Ещё вариант</span></button>
      <button class="action" onclick="go('main')">← На главную</button>
    </div>
  </div>
  <div id="saved" class="screen">
    <div class="top"><div class="header"><span class="greet">Избранное ❤️</span><span class="gear" onclick="go('main')">←</span></div></div>
    <div class="mid savedlist" id="savedlist"></div>
  </div>
  <div class="toast" id="toast">Скопировано в буфер! ✨</div>
</div>
<script>
const TONES=[{id:'support',label:'🧸 Бережная поддержка'},{id:'push',label:'🔥 Дружеский пинок'},{id:'zen',label:'🧘 Стоический дзен'},{id:'humor',label:'😏 С легким юмором'}];
const TAGS=[{name:'Работа',icon:'💼'},{name:'Сон',icon:'😴'},{name:'Люди',icon:'👥'},{name:'Просто так',icon:'🎲'}];
const TONE_LABELS={support:'🧸 Бережная',push:'🔥 Пинок',zen:'🧘 Дзен',humor:'😏 Юмор'};
const TOD_ICON={утро:'☀️',день:'🌤️',вечер:'🌙',ночь:'🌑'};
let state={name:'',tone:'support',mood:null,reason:null,streak:1,recent:[],saved:[],isLoading:false};

function load(){
  const n=localStorage.getItem('name');
  const t=localStorage.getItem('tone');
  let saved=JSON.parse(localStorage.getItem('saved')||'[]');
  state.saved=saved.filter(s=>s!=='Подбираем слова...' && !s.includes('Подбираем слова'));
  state.recent=JSON.parse(localStorage.getItem('recent')||'[]');
  state.streak=parseInt(localStorage.getItem('streak')||'1');
  if(n){
    state.name=n;
    state.tone=t||'support';
    go('main');
    updateMain();
  }else{
    renderTones();
    go('onboard');
  }
}

function go(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById(s).classList.add('active');
}

function renderTones(){
  const el=document.getElementById('tones');
  el.innerHTML='';
  TONES.forEach(t=>{
    const d=document.createElement('div');
    d.className='card'+(state.tone===t.id?' active':'');
    d.textContent=t.label;
    d.onclick=()=>{state.tone=t.id;renderTones();};
    el.appendChild(d);
  });
}

function saveOnboard(){
  state.name=document.getElementById('name').value.trim()||'Друг';
  localStorage.setItem('name',state.name);
  localStorage.setItem('tone',state.tone);
  updateMain();
  go('main');
}

function openSettings(){
  document.getElementById('name').value=state.name;
  renderTones();
  go('onboard');
}

function updateMain(){
  document.getElementById('greet').textContent=state.name+' 👋';
  document.getElementById('streakbadge').textContent='🔥 '+state.streak+' дн.';
  const dots=document.getElementById('dots');
  dots.innerHTML='';
  state.recent.slice(-5).forEach(m=>{
    const d=document.createElement('div');
    d.className='dot '+(m==='charged'?'charged':'drained');
    dots.appendChild(d);
  });
}

let currentMood=null;
function goTags(m){
  currentMood=m;
  const el=document.getElementById('chips');
  el.innerHTML='';
  TAGS.forEach(t=>{
    const d=document.createElement('div');
    d.className='chip';
    d.textContent=t.icon+' '+t.name;
    d.onclick=()=>ask(t.name);
    el.appendChild(d);
  });
  go('tags');
}

async function ask(tag){
  const reason=tag||null;
  state.reason=reason;
  state.recent.push(currentMood);
  if(state.recent.length>5) state.recent.shift();
  localStorage.setItem('recent',JSON.stringify(state.recent));
  state.streak=(state.recent.length>1 && state.recent[state.recent.length-1]===state.recent[state.recent.length-2])?state.streak+1:1;
  localStorage.setItem('streak',state.streak);
  
  const h=new Date().getHours();
  const bucket=h<6?'ночь':h<12?'утро':h<18?'день':'вечер';
  
  state.isLoading=true;
  const favbtn=document.getElementById('favbtn');
  const retrybtn=document.getElementById('retrybtn');
  const retryicon=document.getElementById('retryicon');
  
  favbtn.disabled=true;
  favbtn.classList.remove('fav');
  favbtn.textContent='❤️ В избранное';
  favbtn.style.color='#ffffff';
  
  retrybtn.disabled=true;
  retryicon.classList.add('spin');
  
  document.getElementById('resulttext').innerHTML='<span class="pulse">Подбираем слова...</span>';
  document.getElementById('microtext').textContent='';
  document.getElementById('micro').classList.add('hidden');
  document.getElementById('micro').classList.remove('done');
  document.getElementById('microcb').checked=false;
  
  const ctx=document.getElementById('ctx');
  ctx.innerHTML=`<span class="ctxbadge">${TONE_LABELS[state.tone]}</span>${reason?`<span class="ctxbadge">${TAGS.find(t=>t.name===reason)?.icon} ${reason}</span>`:''}<span class="ctxbadge">${TOD_ICON[bucket]} ${bucket}</span>`;
  go('result');
  
  try{
    const r=await fetch('/api/motivate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        name:state.name,
        tone:state.tone,
        mood:currentMood,
        reason,
        time_of_day:bucket,
        streak:state.streak
      })
    });
    const d=await r.json();
    document.getElementById('resulttext').textContent=d.text;
    const m=document.getElementById('micro');
    const cb=document.getElementById('microcb');
    m.classList.remove('done');
    cb.checked=false;
    document.getElementById('microtext').textContent=d.micro_action||'';
    m.classList.remove('hidden');
  }catch(e){
    document.getElementById('resulttext').textContent='Ошибка связи с сервером.';
  }finally{
    state.isLoading=false;
    favbtn.disabled=false;
    retrybtn.disabled=false;
    retryicon.classList.remove('spin');
  }
}

function retry(){
  if(state.isLoading) return;
  ask(state.reason);
}

function toggleMicro(e){
  const m=document.getElementById('micro');
  const cb=document.getElementById('microcb');
  if(!m || !cb) return;
  if(e && e.target === cb){
    if(cb.checked){
      m.classList.add('done');
    } else {
      m.classList.remove('done');
    }
  } else {
    cb.checked = !cb.checked;
    if(cb.checked){
      m.classList.add('done');
    } else {
      m.classList.remove('done');
    }
  }
}

function fav(){
  if(state.isLoading) return;
  const text=document.getElementById('resulttext').textContent;
  if(text && !text.includes('Подбираем') && !state.saved.includes(text)){
    state.saved.push(text);
    localStorage.setItem('saved',JSON.stringify(state.saved));
  }
  const b=document.getElementById('favbtn');
  b.classList.add('fav');
  b.textContent='💖 Сохранено';
  b.style.color='#ffffff';
}

function copyText(){
  const t=document.getElementById('resulttext').textContent;
  navigator.clipboard.writeText(t);
  const toast=document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1800);
}

function openSaved(){
  const list=document.getElementById('savedlist');
  if(state.saved.length){
    list.innerHTML=state.saved.map((s,i)=>`
      <div class="saveditem">
        <span>${s}</span>
        <span class="del" onclick="delSaved(${i})" title="Удалить">✕</span>
      </div>
    `).join('');
  } else {
    list.innerHTML=`
      <div class="empty-saved">
        <div class="empty-saved-icon">🤍</div>
        <div class="empty-saved-title">Здесь будут твои любимые цитаты</div>
        <div class="empty-saved-text">Нажимай „В избранное“, когда фраза отзовется в сердце.</div>
      </div>
    `;
  }
  go('saved');
}

function delSaved(i){
  state.saved.splice(i,1);
  localStorage.setItem('saved',JSON.stringify(state.saved));
  openSaved();
}

// Register service worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
  });
}

load();
</script>
</body>
</html>
